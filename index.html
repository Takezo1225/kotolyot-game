<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#10153b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Котолёт">
<link rel="manifest" href="manifest.json">
<title>Котолёт: звёздный путь</title>
<style>
:root{--ink:#f8f7ff;--glass:rgba(14,20,60,.68);--gold:#ffe66d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090d29;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#game{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.pill{background:var(--glass);border:1px solid #ffffff35;backdrop-filter:blur(10px);border-radius:18px;padding:9px 12px;font-weight:800;box-shadow:0 8px 25px #0003}
.small{font-size:12px;opacity:.8;font-weight:650}
#stars{color:var(--gold)} #level{color:#a9f7ff}
#pause{pointer-events:auto;border:1px solid #ffffff45;background:var(--glass);color:white;border-radius:50%;width:44px;height:44px;font-size:19px}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;background:linear-gradient(180deg,#080d2a70,#090d29a8);backdrop-filter:blur(5px)}
.panel{width:min(480px,100%);max-height:90%;overflow:auto;text-align:center;background:linear-gradient(145deg,#232b70ed,#171945f2);border:1px solid #ffffff35;border-radius:30px;padding:26px 22px;box-shadow:0 25px 80px #0007}
.emoji{font-size:65px;filter:drop-shadow(0 8px 12px #0005);animation:bob 2.2s ease-in-out infinite}
h1{font-size:clamp(28px,8vw,43px);line-height:1.02;margin:8px 0 12px;letter-spacing:-1px}
p{line-height:1.5;color:#e1e5ff;margin:10px 0 18px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 16px}
.stat{background:#ffffff12;border:1px solid #ffffff25;border-radius:15px;padding:10px 7px;font-size:13px;color:#e9eaff}
.stat strong{display:block;color:#ffe66d;font-size:19px;margin-bottom:2px}
button.action{border:0;border-radius:18px;padding:14px 20px;font-size:17px;font-weight:900;color:#25164f;background:linear-gradient(135deg,#fff27d,#ffb85c);box-shadow:0 7px 0 #c76c4c;cursor:pointer;width:100%;margin-top:8px}
button.secondary{background:#ffffff16;color:white;box-shadow:none;border:1px solid #ffffff40}
.row{display:flex;gap:10px}.row>*{flex:1}
.hidden{display:none!important}
.controls{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}
.control{pointer-events:auto;border:1px solid #ffffff55;background:#101747a8;color:#fff;border-radius:24px;width:76px;height:68px;font-size:28px;font-weight:900;backdrop-filter:blur(8px);box-shadow:0 7px 20px #0003;user-select:none}
#boost{width:96px;font-size:14px;letter-spacing:.5px;color:#fff29a}
.hint{position:absolute;bottom:105px;left:0;right:0;text-align:center;font-size:12px;color:#ffffffbd;text-shadow:0 2px 5px #000;pointer-events:none}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-9px) rotate(3deg)}}
@media(min-width:700px){.control{width:90px;height:78px}.controls{padding:0 35px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud" id="hud">
  <div class="pill"><div id="level">Планета 1</div><div class="small" id="planet">Лавандовый мир</div></div>
  <div class="pill"><div>⭐ <span id="stars">0</span>/<span id="goal">8</span></div><div class="small">Звёзды для прыжка</div></div>
  <button id="pause" aria-label="Пауза">Ⅱ</button>
</div>
<div class="hint" id="hint">Веди кота пальцем или используй кнопки ← →</div>
<div class="controls" id="controls">
  <button class="control" id="left" aria-label="Влево">←</button>
  <button class="control" id="boost">РЫВОК ✨</button>
  <button class="control" id="right" aria-label="Вправо">→</button>
</div>
<div class="overlay" id="overlay">
 <div class="panel">
  <div class="emoji" id="hero">🐱‍🚀</div>
  <h1 id="title">Котолёт:<br>звёздный путь</h1>
  <p id="message">Помоги отважному коту-пилоту добраться до новых планет! Собирай звёзды, уворачивайся от метеоритов и космических ловушек.</p>
  <div class="stats" id="stats">
    <div class="stat"><strong id="bestStars">0 ⭐</strong>Рекорд звёзд</div>
    <div class="stat"><strong id="openPlanet">1</strong>Самая дальняя планета</div>
  </div>
  <div class="row"><button class="action secondary" id="how">Как играть</button><button class="action" id="start">Новый полёт 🚀</button></div>
  <button class="action secondary hidden" id="resume">Продолжить с планеты</button>
 </div>
</div>
<script>
(() => {
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
let W=0,H=0,dpr=1, running=false, paused=false, last=0, time=0, score=0, level=1, distance=0, spawn=0, shake=0, boost=0, invuln=0;
let runStars=0;
let player={x:0,y:0,tx:0,vy:0};
let stars=[], rocks=[], particles=[], bgStars=[];
const names=['Лавандовый мир','Мятная орбита','Коралловая туманность','Сапфировый гигант','Радужный рубеж','Галактика мур-мяу','Туманность мечты','Край Вселенной'];
const palettes=[['#293b91','#7d69e8','#ffb6f5'],['#0e786e','#38d6ba','#b4fff0'],['#8b345f','#ff806e','#ffd18c'],['#123a80','#42b6ff','#d6f8ff'],['#542b9c','#fb7bd4','#ffe3ff'],['#203f74','#77e7d2','#fff1a8'],['#442b7d','#b9a0ff','#ffe5c8'],['#10235b','#71d9ff','#fff7c2']];
const goal=()=>7+Math.min(7,level-1)*2;

// Сохранение прогресса на устройстве
const SAVE_KEY='kotolyot-progress-v1';
let progress={bestStars:0,bestLevel:1,unlockedLevel:1};

function loadProgress(){
  try{
    const saved=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');
    if(saved&&typeof saved==='object'){
      progress.bestStars=Math.max(0,Number(saved.bestStars)||0);
      progress.bestLevel=Math.max(1,Number(saved.bestLevel)||1);
      progress.unlockedLevel=Math.max(1,Number(saved.unlockedLevel)||1);
    }
  }catch(e){console.warn('Не удалось прочитать сохранение',e);}
  progress.unlockedLevel=Math.max(progress.unlockedLevel,progress.bestLevel);
  updateProgressUI();
}

function saveProgress(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(progress));}
  catch(e){console.warn('Не удалось сохранить прогресс',e);}
  updateProgressUI();
}

function updateProgressUI(){
  $('bestStars').textContent=progress.bestStars+' ⭐';
  $('openPlanet').textContent=progress.unlockedLevel;
  $('resume').classList.toggle('hidden',progress.unlockedLevel<=1);
  $('resume').textContent='Продолжить с планеты '+progress.unlockedLevel+' 🚀';
}

function recordProgress(){
  let changed=false;
  if(runStars>progress.bestStars){progress.bestStars=runStars;changed=true;}
  if(level>progress.bestLevel){progress.bestLevel=level;changed=true;}
  if(level>progress.unlockedLevel){progress.unlockedLevel=level;changed=true;}
  if(changed)saveProgress();
}

function resize(){
  dpr=Math.min(devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  canvas.width=W*dpr;canvas.height=H*dpr;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  player.y=H*.72;
  if(!player.x)player.x=W*.5;
  player.x=Math.min(W-35,Math.max(35,player.x));
  player.tx=player.x;
  bgStars=Array.from({length:100},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.8+.3,s:Math.random()*25+8,a:Math.random()*.7+.2}));
}
addEventListener('resize',resize);resize();

function updateHUD(){
  $('level').textContent='Планета '+level;
  $('planet').textContent=names[(level-1)%names.length];
  $('stars').textContent=score;
  $('goal').textContent=goal();
}

function reset(startLevel=1){
  score=0;level=Math.max(1,startLevel);runStars=0;
  distance=0;spawn=0;stars=[];rocks=[];particles=[];
  boost=0;invuln=1.8;
  player.x=W*.5;player.tx=player.x;player.y=H*.72;
  updateHUD();
}

function show(title,msg,button='Играть снова 🚀'){
  $('title').innerHTML=title;
  $('message').textContent=msg;
  $('start').textContent=button;
  $('overlay').classList.remove('hidden');
  $('controls').classList.add('hidden');
  $('hint').classList.add('hidden');
  running=false;
  updateProgressUI();
}

function begin(startLevel=1){
  reset(startLevel);
  $('overlay').classList.add('hidden');
  $('controls').classList.remove('hidden');
  $('hint').classList.remove('hidden');
  running=true;paused=false;last=performance.now();
  requestAnimationFrame(loop);
}

$('start').onclick=()=>{if(paused)beginResume();else begin(1);};

$('how').onclick=()=>show(
  'Как играть? 🐾',
  'Двигай кота влево и вправо пальцем по экрану или кнопками. Собирай ⭐ — когда наберёшь нужное число, совершишь прыжок к следующей планете. Избегай метеоритов! Кнопка «РЫВОК» даёт короткую неуязвимость. Каждый новый мир быстрее и опаснее.',
  'Новый полёт 🚀'
);

$('pause').onclick=()=>{
  if(!running){$('overlay').classList.remove('hidden');return;}
  paused=!paused;
  if(paused){
    $('title').textContent='Пауза ☕';
    $('message').textContent='Кот-пилот отдыхает перед следующим манёвром.';
    $('start').textContent='Продолжить полёт';
    $('overlay').classList.remove('hidden');
    $('controls').classList.add('hidden');
    running=false;
  }else beginResume();
};

function beginResume(){
  $('overlay').classList.add('hidden');
  $('controls').classList.remove('hidden');
  $('hint').classList.remove('hidden');
  running=true;paused=false;last=performance.now();
  requestAnimationFrame(loop);
}

$('resume').onclick=()=>begin(progress.unlockedLevel);

$('left').onpointerdown=e=>{
  e.preventDefault();
  player.tx=Math.max(30,player.x-100);
};
$('right').onpointerdown=e=>{
  e.preventDefault();
  player.tx=Math.min(W-30,player.x+100);
};
$('boost').onpointerdown=e=>{
  e.preventDefault();
  boost=1.1;invuln=Math.max(invuln,.8);
  burst(player.x,player.y,'#fff28a',20);
};

canvas.addEventListener('pointerdown',e=>{
  if(!running)return;
  player.tx=Math.max(28,Math.min(W-28,e.clientX));
});
canvas.addEventListener('pointermove',e=>{
  if(!running||e.buttons===0)return;
  player.tx=Math.max(28,Math.min(W-28,e.clientX));
});

function burst(x,y,color,n){
  for(let i=0;i<n;i++)particles.push({
    x,y,vx:(Math.random()-.5)*210,vy:(Math.random()-.5)*210,
    life:Math.random()*.65+.25,max:.9,r:Math.random()*4+1,color
  });
}

function spawnStuff(){
  const speed=180+level*22;
  if(Math.random()<.72){
    stars.push({x:30+Math.random()*(W-60),y:-25,r:12+Math.random()*3,
      rot:0,speed:speed*(.8+Math.random()*.4),phase:Math.random()*7});
  }
  if(Math.random()<Math.min(.82,.32+level*.055)){
    let r=17+Math.random()*16;
    rocks.push({x:30+Math.random()*(W-60),y:-40,r,
      speed:speed*(.75+Math.random()*.65),rot:Math.random()*6,spin:(Math.random()-.5)*2});
  }
}

function loop(now){
  if(!running)return;
  let dt=Math.min(.035,(now-last)/1000||.016);
  last=now;time+=dt;
  update(dt);draw();
  if(running)requestAnimationFrame(loop);
}

function update(dt){
  const speed=180+level*22;
  distance+=dt*speed;
  spawn-=dt;
  if(spawn<=0){spawn=Math.max(.28,1.0-level*.065);spawnStuff();}

  player.x+=(player.tx-player.x)*Math.min(1,dt*8);
  player.x=Math.max(25,Math.min(W-25,player.x));
  boost=Math.max(0,boost-dt);
  invuln=Math.max(0,invuln-dt);
  shake=Math.max(0,shake-dt);

  for(let s of stars){
    s.y+=s.speed*dt;s.rot+=dt*2;
    s.x+=Math.sin(time*2+s.phase)*dt*12;
    if(Math.hypot(s.x-player.x,s.y-player.y)<s.r+24){
      s.got=true;score++;runStars++;
      recordProgress();
      burst(s.x,s.y,'#ffe66d',13);
      updateHUD();
    }
  }
  stars=stars.filter(s=>!s.got&&s.y<H+40);

  for(let r of rocks){
    r.y+=r.speed*dt;r.rot+=r.spin*dt;
    if(invuln<=0&&Math.hypot(r.x-player.x,r.y-player.y)<r.r+19){
      r.hit=true;shake=.25;invuln=1.25;
      score=Math.max(0,score-2);
      burst(player.x,player.y,'#ff718e',22);
      updateHUD();
    }
  }
  rocks=rocks.filter(r=>!r.hit&&r.y<H+60);

  for(let p of particles){
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.98;p.vy*=.98;p.life-=dt;
  }
  particles=particles.filter(p=>p.life>0);

  if(score>=goal()){
    level++;recordProgress();
    score=0;stars=[];rocks=[];invuln=2;boost=0;
    burst(player.x,player.y,'#b7fff7',60);
    updateHUD();
    $('planet').textContent='Прыжок к новой планете!';
  }
}

function draw(){
  let pal=palettes[(level-1)%palettes.length];
  let grad=ctx.createLinearGradient(0,0,W,H);
  grad.addColorStop(0,pal[0]);grad.addColorStop(.55,'#141b49');grad.addColorStop(1,'#090d29');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);

  ctx.save();ctx.globalAlpha=.18;
  for(let i=0;i<4;i++){
    let x=(Math.sin(time*.12+i*2)*.4+.5)*W,y=(i*.23+.12)*H;
    let g=ctx.createRadialGradient(x,y,2,x,y,W*.36);
    g.addColorStop(0,pal[1]);g.addColorStop(1,'transparent');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  }
  ctx.restore();

  for(let s of bgStars){
    let yy=(s.y+time*s.s*(1+level*.04))%(H+10);
    ctx.globalAlpha=s.a*(.65+.35*Math.sin(time*2+s.x));
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,yy,s.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;

  let py=H*.15,pr=Math.min(W*.3,100)+level*2;
  let pg=ctx.createRadialGradient(W*.78-pr*.35,py-pr*.4,3,W*.78,py,pr*1.5);
  pg.addColorStop(0,pal[2]);pg.addColorStop(.45,pal[1]);pg.addColorStop(1,pal[0]);
  ctx.fillStyle=pg;ctx.beginPath();ctx.arc(W*.78,py,pr,0,Math.PI*2);ctx.fill();

  ctx.save();ctx.globalAlpha=.2;ctx.strokeStyle='#fff';
  for(let i=0;i<5;i++){
    ctx.beginPath();ctx.ellipse(W*.78,py,pr*(.5+i*.13),pr*(.14+i*.035),-.3,0,Math.PI*2);ctx.stroke();
  }
  ctx.restore();

  ctx.strokeStyle='#b9dfff35';
  for(let i=0;i<12;i++){
    let x=(i*97+Math.sin(time+i)*25)%W;
    let y=((i*137+time*(230+level*15))%(H+80))-40;
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-5,y+18+level);ctx.stroke();
  }

  for(let s of stars){
    ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.rot);
    ctx.shadowColor='#ffe66d';ctx.shadowBlur=18;ctx.fillStyle='#fff1a0';
    ctx.beginPath();
    for(let i=0;i<10;i++){
      let a=-Math.PI/2+i*Math.PI/5,r=i%2?s.r*.43:s.r;
      ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);
    }
    ctx.closePath();ctx.fill();ctx.restore();
  }

  for(let r of rocks){
    ctx.save();ctx.translate(r.x,r.y);ctx.rotate(r.rot);
    ctx.fillStyle='#b98277';ctx.strokeStyle='#ffd0a0';ctx.lineWidth=2;
    ctx.beginPath();
    for(let i=0;i<9;i++){
      let a=i*Math.PI*2/9,rr=r.r*(.76+Math.sin(i*4.1)*.19);
      if(!i)ctx.moveTo(Math.cos(a)*rr,Math.sin(a)*rr);
      else ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);
    }
    ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle='#825b67';
    ctx.beginPath();ctx.arc(-r.r*.25,-r.r*.12,r.r*.18,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(r.r*.28,r.r*.25,r.r*.12,0,7);ctx.fill();
    ctx.restore();
  }

  for(let p of particles){
    ctx.globalAlpha=Math.max(0,p.life/p.max);
    ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();
  }
  ctx.globalAlpha=1;

  ctx.save();ctx.translate(player.x,player.y+Math.sin(time*7)*3);
  if(shake)ctx.translate((Math.random()-.5)*12,(Math.random()-.5)*10);

  if(invuln>0){
    ctx.strokeStyle='#a8ffffaa';ctx.lineWidth=3;
    ctx.beginPath();ctx.ellipse(0,0,34+Math.sin(time*14)*3,42+Math.sin(time*14)*3,0,0,7);ctx.stroke();
  }

  if(boost>0){
    ctx.fillStyle='#fff2a2';ctx.beginPath();
    ctx.moveTo(-10,19);ctx.lineTo(0,48+Math.random()*15);ctx.lineTo(10,19);ctx.fill();
    ctx.fillStyle='#ff9e7a';ctx.beginPath();
    ctx.moveTo(-5,20);ctx.lineTo(0,39+Math.random()*9);ctx.lineTo(5,20);ctx.fill();
  }else{
    ctx.fillStyle='#74e9ff';ctx.beginPath();
    ctx.moveTo(-7,20);ctx.lineTo(0,32+Math.random()*7);ctx.lineTo(7,20);ctx.fill();
  }

  ctx.fillStyle='#f5f5ff';ctx.strokeStyle='#8aa7dd';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,-31);ctx.quadraticCurveTo(22,-10,15,17);
  ctx.lineTo(-15,17);ctx.quadraticCurveTo(-22,-10,0,-31);ctx.fill();ctx.stroke();

  ctx.fillStyle='#ff7eaa';ctx.beginPath();
  ctx.moveTo(-14,8);ctx.lineTo(-25,24);ctx.lineTo(-12,20);ctx.fill();
  ctx.beginPath();ctx.moveTo(14,8);ctx.lineTo(25,24);ctx.lineTo(12,20);ctx.fill();

  ctx.fillStyle='#d8a16c';ctx.beginPath();
  ctx.moveTo(-16,-12);ctx.lineTo(-17,-32);ctx.lineTo(-3,-23);
  ctx.quadraticCurveTo(0,-26,3,-23);ctx.lineTo(17,-32);ctx.lineTo(16,-12);
  ctx.quadraticCurveTo(18,4,0,5);ctx.quadraticCurveTo(-18,4,-16,-12);ctx.fill();

  ctx.fillStyle='#f8d8b1';ctx.beginPath();ctx.ellipse(0,-6,11,7,0,0,7);ctx.fill();
  ctx.fillStyle='#2d274b';ctx.beginPath();
  ctx.ellipse(-7,-12,3,4,0,0,7);ctx.ellipse(7,-12,3,4,0,0,7);ctx.fill();
  ctx.fillStyle='#ff789f';ctx.beginPath();ctx.moveTo(-3,-5);ctx.lineTo(3,-5);ctx.lineTo(0,-2);ctx.fill();

  ctx.fillStyle='#52678d';ctx.beginPath();ctx.arc(0,-19,16,Math.PI,Math.PI*2);ctx.fill();
  ctx.fillStyle='#f9d66a';ctx.fillRect(-14,-20,28,3);
  ctx.fillStyle='#a9efff';ctx.beginPath();ctx.arc(-7,-20,4,0,7);ctx.arc(7,-20,4,0,7);ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.beginPath();
  ctx.arc(-7,-20,4,0,7);ctx.arc(7,-20,4,0,7);ctx.stroke();
  ctx.restore();

  ctx.fillStyle='#ffffff25';ctx.beginPath();ctx.roundRect(W*.22,H-14,W*.56,5,3);ctx.fill();
  ctx.fillStyle='#ffe66d';ctx.beginPath();
  ctx.roundRect(W*.22,H-14,W*.56*Math.min(1,score/goal()),5,3);ctx.fill();
}

loadProgress();
updateHUD();

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
})();
</script>
</body>
</html>
